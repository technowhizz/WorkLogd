<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="WorkLogd">
  <!--
    The brand pack ships this file with the classes but no <style>, so it renders as a black
    square. Fills restored per design-plan.md section 4: tile and rule swap between modes, the
    wedge stays #EC3013 in both because it always sits on the light tile.
  -->
  <style>
    .tile { fill: #201E1D }
    .rule { fill: #F3F2F2 }
    .wedge { fill: #EC3013 }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #F3F2F2 }
      .rule { fill: #201E1D }
    }
  </style>
  <rect class="tile" width="96" height="96"></rect>
  <polygon class="wedge" points="34,14 62,14 50,52 34,52"></polygon>
  <rect class="rule" x="34" y="66" width="44" height="6"></rect>
</svg>
