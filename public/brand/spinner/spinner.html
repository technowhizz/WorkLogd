<!-- Themed by CSS vars: works in light and dark with no swap. -->
<svg class="wl-spin-tally" viewBox="0 0 96 96" width="32" height="32" role="img" aria-label="Loading"
     style="border-radius:7px;overflow:hidden">
  <rect width="96" height="96" fill="var(--wl-logo-tile,#201E1D)"/>
  <polygon class="wl-part wl-wedge" points="34,14 62,14 50,52 34,52" fill="var(--wl-logo-wedge,#EC3013)"/>
  <rect class="wl-part wl-rule" x="34" y="66" width="44" height="6" fill="var(--wl-logo-rule,#F3F2F2)"/>
</svg>

<!-- Swap wl-spin-tally for wl-spin-count for the duration variant.
     Where CSS cannot reach (an <img>, an email, a splash screen) use the
     standalone files instead: light/spinner-tally.svg, dark/spinner-tally.svg,
     or spinner-tally-adaptive.svg which carries its own prefers-color-scheme. -->
